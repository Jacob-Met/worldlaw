name: Worldlaw active experiment receiving
on:
  pull_request:
    paths:
      - 'src/active/**'
      - 'src/science/active-experiment-record.mjs'
      - 'src/science/active-linear-family.mjs'
      - 'examples/active-*.json'
      - 'src/notebook-recovery.mjs'
      - 'scripts/active-*.mjs'
      - 'tests/active-*.test.mjs'
      - 'active.html'
      - 'active.css'
      - 'index.html'
      - 'server.mjs'
      - '.github/workflows/active-experiment-ui.yml'
  push:
    branches: [main]
    paths:
      - 'src/active/**'
      - 'src/science/active-experiment-record.mjs'
      - 'src/science/active-linear-family.mjs'
      - 'examples/active-*.json'
      - 'src/notebook-recovery.mjs'
      - 'scripts/active-*.mjs'
      - 'active.html'
      - 'active.css'
      - '.github/workflows/active-experiment-ui.yml'
permissions:
  contents: read
jobs:
  active-experiment-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared records and exact historical replay
        run: node --test tests/active-control-box.test.mjs tests/active-experiment-record.test.mjs tests/active-instrument.test.mjs tests/active-view.test.mjs tests/active-linear-replay.test.mjs tests/notebook-autosave-conflict.test.mjs
      - name: Receive existing workbench and the complete active experiment
        run: |
          npm install --no-save --no-package-lock playwright-core@1.65.1
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$BROWSER"
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE_PATH="$BROWSER" BROWSER_ARTIFACT_DIR=.receipts/active-existing-studio node scripts/browser.mjs
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE_PATH="$BROWSER" node scripts/active-experiment-browser.mjs
      - name: Receive the actual apparatus from the official fresh source distribution
        run: |
          python3 scripts/package.py --source-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/active-worldlaw-source.zip"
          python3 - "$RUNNER_TEMP/active-worldlaw-source.zip" "$RUNNER_TEMP/active-worldlaw-extracted" "$(git rev-parse HEAD)" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          archive=Path(sys.argv[1]);out=Path(sys.argv[2]);out.mkdir()
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  assert (out/name).resolve().is_relative_to(out.resolve())
              z.extractall(out)
          root=out/'worldlaw';manifest=json.loads((root/'SOURCE_MANIFEST.json').read_text())
          assert manifest['sourceCommit']==sys.argv[3] and manifest['sourceMode']=='git-commit'
          for item in manifest['files']:
              content=(root/item['path']).read_bytes()
              assert len(content)==item['bytes'] and hashlib.sha256(content).hexdigest()==item['sha256']
          print(json.dumps({'verifiedFiles':len(manifest['files']),'sourceCommit':manifest['sourceCommit'],
              'archiveSHA256':hashlib.sha256(archive.read_bytes()).hexdigest(),'archiveBytes':archive.stat().st_size}))
          PY
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cd "$RUNNER_TEMP/active-worldlaw-extracted/worldlaw"
          PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/node_modules/playwright-core/index.mjs" BROWSER_EXECUTABLE_PATH="$BROWSER" BROWSER_ARTIFACT_DIR="$GITHUB_WORKSPACE/.receipts/active-packaged" node scripts/active-experiment-browser.mjs
      - name: Retain actual pixels and independent browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-experiment-browser-${{ github.run_id }}
          path: |
            .receipts/active-existing-studio/
            .receipts/active-experiment/
            .receipts/active-packaged/
          if-no-files-found: error
          retention-days: 14
