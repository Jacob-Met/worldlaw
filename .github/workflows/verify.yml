name: Worldlaw scientific verification
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: worldlaw-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast fail on prospective intervention contracts
        run: node --test tests/trajectory-gaussian-discriminator.test.mjs
      - name: Scientific components and package smoke
        run: npm run verify
      - name: Cold-receive sparse Studio in real 1920px and 390px Chrome
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$BROWSER"
          TRAJECTORY_BROWSER_FOCUS=sparse PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE_PATH="$BROWSER" node scripts/trajectory-browser-92be.mjs
      - name: Retain native-resolution sparse acquisition pixels and portable notebook
        uses: actions/upload-artifact@v4
        with:
          name: sparse-sensor-cold-${{ github.run_id }}
          path: .receipts/trajectory-92be/
          retention-days: 7
          if-no-files-found: error
      - name: Freeze prospective policy versus held-out synthetic outcomes
        run: |
          mkdir -p .receipts
          node experiments/gaussian-intervention-comparison.mjs > .receipts/gaussian-intervention-comparison.json
          node -e 'const r=JSON.parse(require("node:fs").readFileSync(".receipts/gaussian-intervention-comparison.json")); console.log(JSON.stringify(r.grouped));'
      - name: Receive declared correlated sensor design and unchanged held-out controls
        run: |
          node experiments/correlated-intervention-comparison.mjs > .receipts/correlated-intervention-comparison.json
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$BROWSER"
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE_PATH="$BROWSER" node scripts/correlated-reading-browser.mjs
      - name: Retain correlated source-bound receiving
        uses: actions/upload-artifact@v4
        with:
          name: correlated-sensor-cold-${{ github.run_id }}
          path: |
            .receipts/correlated-reading/
            .receipts/correlated-intervention-comparison.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain source-pinned evidence (not committed)
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-intervention-heldout-${{ github.run_id }}
          path: .receipts/gaussian-intervention-comparison.json
          retention-days: 7
          if-no-files-found: error


  correlated-nullgarden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover independently pinned Nullgarden receiver
        uses: actions/checkout@v4
        with:
          repository: Jacob-Met/nullgarden
          ref: 75527fb3934f65310b63d6ac9880394c5b98dc29
          path: .independent-nullgarden
          persist-credentials: false
      - name: Run predeclared 64 exact pair assignments and three no-effect controls
        env:
          NULLGARDEN_SOURCE: ${{ github.workspace }}/.independent-nullgarden
          NULLGARDEN_ARTIFACT_DIR: ${{ github.workspace }}/.receipts/correlated-nullgarden
        run: node scripts/correlated-nullgarden-receiving.mjs
      - name: Retain independently received exact-permutation outcomes
        uses: actions/upload-artifact@v4
        with:
          name: correlated-nullgarden-${{ github.run_id }}
          path: .receipts/correlated-nullgarden/
          retention-days: 7
          if-no-files-found: error
