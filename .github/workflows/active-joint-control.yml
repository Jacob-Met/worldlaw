name: Worldlaw joint control receiving
on:
  pull_request:
    paths:
      - 'src/science/active-linear-family.mjs'
      - 'src/science/exact-box-envelope.mjs'
      - 'src/science/active-experiment-record.mjs'
      - 'scripts/active-joint-control-*'
      - 'tests/active-joint-control.test.mjs'
      - 'tests/fixtures/active-joint-control-*'
      - '.github/workflows/active-joint-control.yml'
  push:
    branches: [main]
    paths:
      - 'src/science/active-linear-family.mjs'
      - 'src/science/exact-box-envelope.mjs'
      - 'scripts/active-joint-control-*'
      - '.github/workflows/active-joint-control.yml'
permissions:
  contents: read
jobs:
  independent-joint-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NODE_OPTIONS: '--max-old-space-size=1536'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original locked evaluator and exact previous core
        run: |
          mkdir -p .receipts/active-joint-control
          git show e594f01ef511aee2ad26607fe5b086abbd72068d:src/science/active-linear-family.mjs > "$RUNNER_TEMP/active-joint-prior.mjs"
          python3 - "$RUNNER_TEMP/active-joint-prior.mjs" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          expected={
            sys.argv[1]:'d434733f237711cf316ffc1a5667d5765f19a6423d11902705616df0a5c17156',
            'tests/fixtures/active-joint-control-cases.json':'595fb5111c37e2b72b540b57d6af1f4304759ffc5b28f43f77496ed739002a34',
            'tests/fixtures/active-joint-control-protocol.json':'936eabca645701cece049fdec2357217aecf964bd7190b6b2c247eb232e50b05',
            'scripts/active-joint-control-receiving.py':'5a7e869dfaa354d477de4e7e20918649b5586e0efb7e9b3b6dd338dc890eb491',
            'scripts/active-joint-control-reference.mjs':'83b1d822dc8b31aeaa9017eae670724f8369b24795a4203bae3f0991e7dab78c',
            'scripts/active-joint-control-benchmark.mjs':'42a8c77a29930bc83977469826ef898ed35eecfc38392161f736702d2bd83b48',
          }
          for path,wanted in expected.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual==wanted,(path,actual,wanted)
          print(json.dumps({'frozenInputsVerified':len(expected)}))
          PY
      - name: Preserve every prior binary certificate and historical replay
        run: |
          node --input-type=module - "$RUNNER_TEMP/active-joint-prior.mjs" <<'JS'
          import {readFileSync} from 'node:fs';import {pathToFileURL} from 'node:url';import assert from 'node:assert/strict';
          import * as current from './src/science/active-linear-family.mjs';
          const prior=await import(pathToFileURL(process.argv[2]));
          const cases=JSON.parse(readFileSync('tests/fixtures/active-control-box-cases.json','utf8'));
          for(const row of cases)assert.deepEqual(current.designActiveLinearControlBox(row.request),prior.designActiveLinearControlBox(row.request),row.name);
          console.log(JSON.stringify({unchangedPriorBinaryCertificates:cases.length}));
          JS
          node --test tests/active-joint-control.test.mjs tests/active-linear-replay.test.mjs tests/active-control-box.test.mjs
      - name: Independently compile all schedules and solve all signed LPs
        run: |
          python3 -m pip install numpy==1.26.4 scipy==1.14.1
          python3 scripts/active-joint-control-receiving.py --module src/science/active-linear-family.mjs --cases tests/fixtures/active-joint-control-cases.json --output .receipts/active-joint-control/independent-receiving.json
      - name: Independently enumerate exact vertices on all frozen courses
        run: |
          node --max-old-space-size=1536 --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';import assert from 'node:assert/strict';
          import {exhaustiveJointReference} from './scripts/active-joint-control-reference.mjs';
          import {designActiveLinearJointControl} from './src/science/active-linear-family.mjs';
          const rows=JSON.parse(readFileSync('tests/fixtures/active-joint-control-cases.json','utf8')),receipts=[];
          for(const row of rows){
            const reference=exhaustiveJointReference(row.request),plan=designActiveLinearJointControl(row.request);
            assert.equal(plan.jointPotential.margin,reference.potential,row.name);
            assert.deepEqual(plan.selection?.map(r=>r.tick)??null,reference.selection,row.name);
            assert.equal(plan.totalCost,reference.cost,row.name);
            assert.equal(plan.jointProof?.margin??null,reference.margin,row.name);
            if(row.analytic?.potential!==undefined)assert.equal(reference.potential,row.analytic.potential,row.name);
            if(row.analytic&&Object.hasOwn(row.analytic,'ticks'))assert.deepEqual(reference.selection,row.analytic.ticks,row.name);
            receipts.push({name:row.name,...reference});console.log('EXACT '+row.name);
          }
          writeFileSync('.receipts/active-joint-control/exact-vertices.json',JSON.stringify({cases:receipts.length,node:process.version,receipts},null,2)+'\n');
          console.log(JSON.stringify({exactCourses:receipts.length,failures:0}));
          JS
      - name: Cold ABBA versus the frozen exhaustive reference
        run: |
          python3 - <<'PY'
          import json,statistics,subprocess
          from pathlib import Path
          root=Path.cwd();out=root/'.receipts/active-joint-control';measurements=[];reference={}
          script=root/'scripts/active-joint-control-benchmark.mjs';cases=root/'tests/fixtures/active-joint-control-cases.json'
          for cohort in ['anchor','cohort']:
              for round_number in range(3):
                  for index,mode in enumerate(['before','after','after','before']):
                      module=root/('scripts/active-joint-control-reference.mjs' if mode=='before' else 'src/science/active-linear-family.mjs')
                      command=['node','--max-old-space-size=1536',str(script),str(module),mode,str(cases),cohort,'3']
                      result=subprocess.run(command,capture_output=True,text=True,check=True,timeout=240)
                      row=json.loads(result.stdout);previous=reference.setdefault(cohort,row['digest'])
                      assert row['digest']==previous,(cohort,mode,'semantic disagreement')
                      row.update(round=round_number,index=index)
                      (out/f'{cohort}-{round_number}-{index}-{mode}.json').write_text(json.dumps(row,indent=2)+'\n')
                      measurements.append(row)
          summary={}
          for cohort in ['anchor','cohort']:
              paired={mode:[r for r in measurements if r['cohort']==cohort and r['mode']==mode] for mode in ['before','after']}
              ms={mode:statistics.median(r['perRepetitionMs'] for r in data) for mode,data in paired.items()}
              rss={mode:statistics.median(r['maxRSSKiB'] for r in data) for mode,data in paired.items()}
              summary[cohort]={'medianMillisecondsPerRepetition':ms,'speedup':ms['before']/ms['after'],'medianMaxRSSKiB':rss,
                  'baselineLPVertices':paired['before'][0]['workPerRepetition'],'candidateBudgetNodes':paired['after'][0]['workPerRepetition']}
          receipt={'baseline':'frozen exhaustive reference; not previous shipped continuous functionality',
              'node':subprocess.check_output(['node','--version'],text=True).strip(),'rounds':3,'order':'ABBA',
              'freshProcesses':len(measurements),'summary':summary}
          (out/'abba-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Retain independent mathematical and cold timing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-joint-control-${{ github.run_id }}
          path: .receipts/active-joint-control/
          if-no-files-found: error
          retention-days: 14
