name: Causal projected-state temporal memory
on:
  pull_request:
    paths:
      - 'src/science/temporal-memory.mjs'
      - 'scripts/receive-temporal-memory.mjs'
      - 'tests/temporal-memory.test.mjs'
      - '.github/workflows/temporal-memory.yml'
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match immutable original source
        id: original
        run: |
          matched=yes
          test "$(git hash-object src/science/temporal-memory.mjs)" = "269919e921426b25b57565390f3a0edf01c7f0c1" || matched=no
          test "$(git hash-object scripts/receive-temporal-memory.mjs)" = "ecd48a8bc30c23a9b9de0bd55be16c55853d0ee4" || matched=no
          test "$(git hash-object tests/temporal-memory.test.mjs)" = "95ae1bb299a20d828ade40c1be998bae2474e521" || matched=no
          test "$(git hash-object docs/TEMPORAL_MEMORY_PROBE.md)" = "2472daf7a00225795975c26dfa9bb5f656acf270" || matched=no
          echo "matched=$matched" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.original.outputs.matched != 'yes'
        with:
          repository: Jacob-Met/nullgarden
          ref: 4af7717a866e0246e7c0bcd81977cea53cddbd8c
          path: .independent-state-nullgarden
          persist-credentials: false
      - run: node --test tests/temporal-memory.test.mjs
      - uses: actions/download-artifact@v4
        if: steps.original.outputs.matched == 'yes'
        with:
          github-token: ${{ github.token }}
          run-id: 45313669592
          artifact-ids: 14883709811
          path: .receipts/original-download
      - name: Verify original archive
        if: steps.original.outputs.matched == 'yes'
        run: |
          report=$(find .receipts/original-download -name report.json -type f)
          test -f "$report"
          node scripts/verify-temporal-memory.mjs "$(dirname "$report")"
      - run: node scripts/receive-temporal-memory.mjs
        if: steps.original.outputs.matched != 'yes'
      - uses: actions/upload-artifact@v4
        if: always() && steps.original.outputs.matched != 'yes'
        with:
          name: temporal-memory-receipt
          path: .receipts/temporal-memory/
          if-no-files-found: error
