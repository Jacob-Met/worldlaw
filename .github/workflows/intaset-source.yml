name: InTaSet original quadruple-tank source metadata preflight
on:
  pull_request:
    paths:
      - '.github/workflows/intaset-source.yml'
      - 'experiments/intaset-quadruple-physical.py'
      - 'src/science/quadruple_tank_hydraulics.py'
      - 'tests/intaset-quadruple-physical.test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Acquire author-mirrored original ZIP and verify Zenodo published MD5
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            'https://raw.githubusercontent.com/Moazeni-s-Concise-Lab/InTaSet/main/InTaSet.zip' \
            --output "$RUNNER_TEMP/InTaSet.zip"
          test "$(stat -c %s "$RUNNER_TEMP/InTaSet.zip")" -eq 6107043
          echo '0fe80940a3c9520e665b769f4b8d5ab8  '"$RUNNER_TEMP/InTaSet.zip" | md5sum --check
          sha256sum "$RUNNER_TEMP/InTaSet.zip"
          unzip -t "$RUNNER_TEMP/InTaSet.zip" | tail -1
      - name: SOURCE METADATA ONLY, enumerate names/CSV headers but NEVER numerical rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/InTaSet.zip" <<'PY'
          import sys,zipfile,hashlib,io,csv
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
            files=z.infolist()
            assert len(files)<3000,'unexpectedly huge source file index'
            print('SOURCE-ONLY INVENTORY -- NAMES, EXTENSIONS, BYTE LENGTHS, CSV HEADERS; ZERO OBSERVATION VALUES')
            for entry in files:
              name=entry.filename
              assert not (name.startswith('/') or '..' in name.split('/') or chr(92) in name),'unsafe source path'
              if entry.is_dir():continue
              print('FILE',repr(name),'bytes',entry.file_size,'compressed',entry.compress_size)
              if name.lower().endswith('.csv'):
                with z.open(entry) as f:
                  header=f.readline(16000).decode('utf-8-sig',errors='replace').strip()
                  print('CSV_HEADER_ONLY',repr(name),repr(header[:2000]))
              if name.lower().endswith('.xlsx'):
                with z.open(entry) as f:
                  data=f.read()
                if len(data)<4000000:
                  with zipfile.ZipFile(io.BytesIO(data)) as x:
                    w=x.read('xl/workbook.xml').decode('utf8',errors='replace')
                    import re
                    print('XLSX_SHEETS_ONLY',repr(name),re.findall(r'<sheet name="([^"]+)"',w)[:70])
            print('ORIGINAL_SOURCE_ZIP_SHA256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - name: Check original Zenodo rights metadata without accessing sensor observations
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          u='https://zenodo.org/api/records/17652851'
          try:
            req=urllib.request.Request(u,headers={'User-Agent':'Worldlaw physical source licence provenance/1.0'})
            with urllib.request.urlopen(req,timeout=18) as r: d=json.load(r)
            m=d.get('metadata',{})
            print('ZENODO_METADATA_LICENSE',json.dumps(m.get('rights',m.get('license',None))))
            print('ZENODO_METADATA_DOI',m.get('doi',d.get('doi',None)))
            print('ZENODO_LICENSE_FIELDS',json.dumps({k:v for k,v in m.items() if 'licen' in k.lower() or 'rights' in k.lower()}))
          except Exception as exc:
            print('ZENODO_METADATA_UNAVAILABLE_REQUIRE_MANUAL_LICENSE_CHECK',type(exc).__name__,str(exc)[:300])
          PY
