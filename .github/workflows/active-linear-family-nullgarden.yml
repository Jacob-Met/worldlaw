name: WORLDLAW active intervention independent source receiver
on:
  pull_request:
    paths:
      - 'src/science/active-linear-family.mjs'
      - 'scripts/active-linear-family.mjs'
      - 'scripts/active-family-nullgarden-receiving.mjs'
      - 'scripts/active-noise-primal-receiving.py'
      - 'scripts/active-rank-extension-receiving.py'
      - 'tests/active-linear-family.test.mjs'
      - 'tests/active-intervention-family.test.mjs'
      - 'tests/active-linear-noise.test.mjs'
      - 'tests/active-linear-rank.test.mjs'
      - 'examples/active-*.json'
      - '.github/workflows/active-linear-family-nullgarden.yml'
  push:
    branches: [main]
    paths:
      - 'src/science/active-linear-family.mjs'
      - 'scripts/active-linear-family.mjs'
      - 'scripts/active-family-nullgarden-receiving.mjs'
      - 'scripts/active-noise-primal-receiving.py'
      - 'scripts/active-rank-extension-receiving.py'
      - 'tests/active-linear-family.test.mjs'
      - 'tests/active-intervention-family.test.mjs'
      - 'tests/active-linear-noise.test.mjs'
      - 'tests/active-linear-rank.test.mjs'
      - 'examples/active-*.json'
      - '.github/workflows/active-linear-family-nullgarden.yml'
permissions:
  contents: read
jobs:
  exact-independent-receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact arithmetic, source isolation and held-out rank oracle
        run: node --test tests/active-linear-family.test.mjs tests/active-intervention-family.test.mjs tests/active-linear-noise.test.mjs tests/active-linear-rank.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned independent primal optimizer
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Receive frozen baseline and candidate against the independent primal LP
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          mkdir -p .receipts/active-noise-primal
          git fetch --depth=1 --no-tags origin a1e14d5ef766940bd1a1ad1bf4a2e104a11f41b2
          git show a1e14d5ef766940bd1a1ad1bf4a2e104a11f41b2:src/science/active-linear-family.mjs > "$RUNNER_TEMP/worldlaw-noise-baseline.mjs"
          python scripts/active-noise-primal-receiving.py --module "$RUNNER_TEMP/worldlaw-noise-baseline.mjs" --output .receipts/active-noise-primal/baseline.json --baseline
          python scripts/active-noise-primal-receiving.py --module src/science/active-linear-family.mjs --output .receipts/active-noise-primal/candidate.json
      - name: Independently pin unchanged Nullgarden source
        uses: actions/checkout@v4
        with:
          repository: Jacob-Met/nullgarden
          ref: 75527fb3934f65310b63d6ac9880394c5b98dc29
          path: .independent-nullgarden
          persist-credentials: false
      - name: Receive frozen changed-initial-state synthetic experiment and three independent controls
        env:
          NULLGARDEN_SOURCE: ${{ github.workspace }}/.independent-nullgarden
          NULLGARDEN_ARTIFACT_DIR: ${{ github.workspace }}/.receipts/active-family-nullgarden
        run: node scripts/active-family-nullgarden-receiving.mjs
      - name: Retain exact source and independent evidence, not generated build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-family-source-receiver-${{ github.run_id }}
          path: |
            .receipts/active-family-nullgarden/
            .receipts/active-noise-primal/
          if-no-files-found: error
          retention-days: 14

  rank-extension-independent-receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the unchanged independent primal optimizer
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Receive frozen high-dimensional courses and matched ABBA timings
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          mkdir -p .receipts/active-rank-extension
          echo '9e80bf63e7434f53056009180ca71d7502ef228761540874ea806a9e1f519fe5  scripts/active-rank-extension-receiving.py' | sha256sum --check -
          git fetch --depth=1 --no-tags origin 9924453de132d02f0589369454b9f08676c45ff3
          git show 9924453de132d02f0589369454b9f08676c45ff3:src/science/active-linear-family.mjs > "$RUNNER_TEMP/worldlaw-rank-baseline.mjs"
          python scripts/active-rank-extension-receiving.py --oracle scripts/active-noise-primal-receiving.py --baseline "$RUNNER_TEMP/worldlaw-rank-baseline.mjs" --candidate src/science/active-linear-family.mjs --output .receipts/active-rank-extension/receiving.json
      - name: Retain the original full oracle course, outcomes and ABBA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-rank-extension-${{ github.run_id }}
          path: .receipts/active-rank-extension/
          retention-days: 14
          if-no-files-found: error
