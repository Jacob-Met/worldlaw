name: Paired periodic parity probes
on:
  pull_request:
    paths:
      - 'src/science/periodic-parity.mjs'
      - 'scripts/periodic-parity.mjs'
      - 'scripts/receive-periodic-parity.mjs'
      - 'tests/periodic-parity.test.mjs'
      - '.github/workflows/periodic-parity.yml'
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: Jacob-Met/nullgarden
          ref: 4af7717a866e0246e7c0bcd81977cea53cddbd8c
          path: .independent-state-nullgarden
          persist-credentials: false
      - run: node --test tests/periodic-parity.test.mjs
      - run: node scripts/receive-periodic-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: periodic-parity-receipt
          path: .receipts/periodic-parity/
          if-no-files-found: error
      - name: Frozen scientific gate
        run: node -e "if (!require('./.receipts/periodic-parity/report.json').gate) process.exit(1)"
