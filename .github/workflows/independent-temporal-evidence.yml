name: Independent temporal evidence
on:
  pull_request:
    paths:
      - 'src/science/temporal-evidence.mjs'
      - 'tests/temporal-evidence.test.mjs'
      - 'scripts/verify-temporal-model.mjs'
      - 'experiments/independent-temporal-evidence/**'
      - '.github/workflows/independent-temporal-evidence.yml'
permissions:
  contents: read
jobs:
  frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: Jacob-Met/nullgarden
          ref: 4af7717a866e0246e7c0bcd81977cea53cddbd8c
          path: .independent-state-nullgarden
          persist-credentials: false
      - run: node --test tests/temporal-evidence.test.mjs
      - run: node experiments/independent-temporal-evidence/course.mjs
      - name: Check complete denominator
        run: node -e "const r=require('./.receipts/temporal-evidence/report.json'); if (r.rows.length!==192 || r.groups['time_permutation/random'].n!==60 || r.groups['omitted_mechanism/random'].n!==12) process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-verification-receipt
          path: .receipts/temporal-evidence/
          if-no-files-found: error
